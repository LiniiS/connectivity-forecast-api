services:
  - type: web
    name: internet-quality-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: PREDICTIONS_FILE
        value: data/mock_predictions.csv
      - key: MODELS_FILE
        value: data/models.json
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: LOG_LEVEL
        value: INFO
